# Tiny hardware config used only by tests/test_smoke_pipeline.py to prove the
# workload -> simulator -> metrics -> CSV-row plumbing end-to-end. Not one of the
# array sizes Experiment 1 evaluates for real (see config/hardware/README.md) —
# add those as separate files when Experiment 1 is implemented.
name: smoke_8x8
array_rows: 8
array_cols: 8
sram_kb:
  ifmap: 16
  filter: 16
  ofmap: 16
dram_bandwidth_bytes_per_cycle: 8   # NOTE: not currently simulated — see simulator_interface.write_scale_sim_inputs docstring
energy_per_cycle_pj: 1.0
bytes_per_element: 4   # assume fp32 elements; change per the precision your workloads actually model
docker_image: "scalesim:latest"   # built from docker/scalesim/Dockerfile — see README.md Setup
